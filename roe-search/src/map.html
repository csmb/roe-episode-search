<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Map - Roll Over Easy</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: #f5f5f5;
			color: #2c2c2c;
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.hero {
			position: relative;
			background: linear-gradient(135deg, #2a1510 0%, #7a3a1c 45%, #1a0c08 100%);
			color: #fff;
			text-align: center;
			padding: 1.25rem 2rem;
			flex-shrink: 0;
		}
		.hero-image {
			width: 100%; height: 100%; object-fit: cover;
			position: absolute; top: 0; left: 0; opacity: 0.3;
		}
		.hero-content { position: relative; z-index: 1; }
		.hero h1 {
			font-size: 2rem;
			font-weight: 700;
			letter-spacing: -0.5px;
			text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
			margin-bottom: 0.25rem;
		}
		.hero h1 a { color: inherit; text-decoration: none; }
		.hero h1 a:hover { opacity: 0.85; }
		.hero .tagline {
			font-size: 1.05rem;
			font-weight: 300;
			font-style: italic;
			opacity: 0.9;
			margin-bottom: 0.5rem;
			text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
		}
		.hero nav a {
			color: rgba(255,255,255,0.85);
			text-decoration: none;
			font-size: 0.9rem;
			transition: color 0.2s ease;
		}
		.hero nav a:hover { color: #fff; }
		.hero nav a[aria-current="page"] { color: #fff; border-bottom: 2px solid #FF4F00; padding-bottom: 2px; }
		:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

		@media (max-width: 768px) {
			.hero { padding: 1rem 1.5rem; }
			.hero h1 { font-size: 1.6rem; }
		}

		#map {
			flex: 1;
		}

		.leaflet-popup-content-wrapper {
			border-radius: 6px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.15);
		}

		.place-popup h3 {
			font-size: 14px;
			font-weight: 600;
			margin-bottom: 6px;
		}

		.place-popup .count {
			font-size: 12px;
			color: #777;
			margin-bottom: 8px;
		}

		.place-popup ul {
			list-style: none;
			max-height: 180px;
			overflow-y: auto;
		}

		.place-popup ul li {
			font-size: 12px;
			padding: 3px 0;
			border-bottom: 1px solid #f0f0f0;
		}

		.place-popup ul li:last-child { border-bottom: none; }

		.place-popup ul li a {
			color: #2563eb;
			text-decoration: none;
		}

		.place-popup ul li a:hover { text-decoration: underline; }

		.place-popup ul li .ep-date {
			color: #6b6b6b;
			font-size: 11px;
			margin-left: 4px;
		}

		.map-search {
			background: #fff;
			border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.18);
			overflow: visible;
			width: 240px;
			font-family: inherit;
		}
		.map-search input {
			width: 100%;
			border: none;
			outline: none;
			padding: 8px 12px;
			font-size: 14px;
			border-radius: 6px;
			background: transparent;
			color: #2c2c2c;
		}
		.map-search input::-webkit-search-cancel-button { cursor: pointer; }
		.map-search-results {
			list-style: none;
			margin: 0;
			padding: 0;
			max-height: 320px;
			overflow-y: auto;
			border-top: 1px solid #eee;
			background: #fff;
			border-bottom-left-radius: 6px;
			border-bottom-right-radius: 6px;
		}
		.map-search-results.hidden { display: none; }
		.map-search-results li {
			padding: 8px 12px;
			cursor: pointer;
			font-size: 13px;
			border-bottom: 1px solid #f0f0f0;
		}
		.map-search-results li:last-child { border-bottom: none; }
		.map-search-results li.active,
		.map-search-results li:hover { background: #f6f6f6; }
		.map-search-results li .ep-count {
			display: block;
			font-size: 11px;
			color: #777;
			margin-top: 1px;
		}
		.map-search-results li.empty {
			color: #999;
			cursor: default;
			font-style: italic;
		}
		.map-search-results li.empty:hover { background: transparent; }

		@media (max-width: 640px) {
			.map-search { width: calc(100vw - 80px); }
		}

		#loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: #fff;
			padding: 16px 24px;
			border-radius: 8px;
			box-shadow: 0 2px 12px rgba(0,0,0,0.15);
			z-index: 1000;
			font-size: 14px;
			color: #555;
		}

		.place-detail { font-family: inherit; }
		.place-detail h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
		.place-detail .pd-count { font-size: 12px; color: #777; margin-bottom: 8px; }
		.place-detail .pd-chart { width: 100%; height: 84px; margin: 6px 0 10px; }
		.place-detail .pd-narrative { font-size: 12px; line-height: 1.45; margin-bottom: 10px; }
		.place-detail .pd-narrative .pd-lab { font-weight: 600; color: #c44d02; }
		.place-detail .pd-arc { font-style: italic; color: #555; margin-top: 4px; }
		.place-detail .pd-note { font-size: 12px; color: #999; font-style: italic; margin-bottom: 8px; }
		.place-detail ul { list-style: none; max-height: 160px; overflow-y: auto; }
		.place-detail li { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
		.place-detail li:last-child { border-bottom: none; }
		.place-detail li a { color: #2563eb; text-decoration: none; }
		.place-detail li a:hover { text-decoration: underline; }
		.place-detail .ep-date { color: #6b6b6b; font-size: 11px; margin-left: 4px; }
		.pd-chip { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 8px;
		  margin-left: 4px; color: #fff; vertical-align: middle; }
		.pd-loading { font-size: 12px; color: #777; padding: 4px 0; }

		#pd-sheet {
		  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
		  background: #fff; border-radius: 12px 12px 0 0;
		  box-shadow: 0 -2px 16px rgba(0,0,0,0.25);
		  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
		  max-height: 75vh; overflow-y: auto;
		  transform: translateY(100%); transition: transform 0.25s ease;
		}
		#pd-sheet.open { transform: translateY(0); }
		#pd-sheet .pd-close {
		  position: absolute; top: 8px; right: 12px; font-size: 22px;
		  background: none; border: none; cursor: pointer; color: #777; line-height: 1;
		}
		#pd-backdrop {
		  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1999;
		  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
		}
		#pd-backdrop.open { opacity: 1; pointer-events: auto; }
	</style>
</head>
<body>
	<div class="hero">
		<img class="hero-image" src="https://akiaiq6swxkqiixrwd6qcomhaystacksoftwarearq-us-west-1.s3.us-west-1.amazonaws.com/ferry_building.png" alt="" role="presentation">
		<div class="hero-content">
			<h1><a href="/">Roll Over Easy</a></h1>
			<div class="tagline">SF Places Map · <span id="place-count">Loading…</span></div>
			<nav aria-label="Main navigation"><a href="/episodes">Episodes</a> · <a href="/map" aria-current="page">Map</a></nav>
		</div>
	</div>
	<div id="map"></div>
	<div id="loading">Loading places…</div>
	<div id="pd-backdrop"></div>
	<div id="pd-sheet" role="dialog" aria-modal="true" aria-label="Place detail">
	  <button class="pd-close" aria-label="Close">&times;</button>
	  <div id="pd-sheet-body"></div>
	</div>

	<script>
		const SearchControl = L.Control.extend({
			options: { position: 'topleft' },
			onAdd() {
				const container = L.DomUtil.create('div', 'map-search leaflet-bar');
				container.innerHTML = `
					<input type="search" placeholder="Search a place…" autocomplete="off" spellcheck="false" aria-label="Search places">
					<ul class="map-search-results hidden" role="listbox"></ul>
				`;
				L.DomEvent.disableClickPropagation(container);
				L.DomEvent.disableScrollPropagation(container);
				return container;
			},
		});

		function debounce(fn, ms) {
			let t = null;
			return (...args) => {
				clearTimeout(t);
				t = setTimeout(() => fn(...args), ms);
			};
		}

		function renderSearchResults(listEl, hits) {
			if (hits.length === 0) {
				listEl.innerHTML = '<li class="empty">No matching places.</li>';
				listEl.classList.remove('hidden');
				return;
			}
			listEl.innerHTML = hits.map((h, i) => {
				const p = h.item;
				const plural = p.episode_count === 1 ? 'episode' : 'episodes';
				return `<li role="option" data-name="${escapeHtml(p.name)}"${i === 0 ? ' class="active"' : ''}>
					${escapeHtml(p.name)}
					<span class="ep-count">${p.episode_count} ${plural}</span>
				</li>`;
			}).join('');
			listEl.classList.remove('hidden');
		}

		function selectResult(name, input, list) {
			const marker = markersByName.get(name);
			if (!marker) return;
			const latlng = marker.getLatLng();
			map.flyTo(latlng, 17, { duration: 0.6 });
			marker.openPopup();
			input.value = '';
			list.classList.add('hidden');
			list.innerHTML = '';
			if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
				input.blur();
			}
		}

		function moveActive(list, dir) {
			const rows = [...list.querySelectorAll('li[data-name]')];
			if (rows.length === 0) return;
			const currentIdx = rows.findIndex(r => r.classList.contains('active'));
			const nextIdx = ((currentIdx === -1 ? 0 : currentIdx + dir) + rows.length) % rows.length;
			rows.forEach((r, i) => r.classList.toggle('active', i === nextIdx));
			rows[nextIdx].scrollIntoView({ block: 'nearest' });
		}

		function escapeHtml(str) {
			return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
		}

		const SENTIMENT_COLORS = {
		  positive: '#3a9d4a', negative: '#c0392b',
		  neutral: '#8a8a8a', mixed: '#b8860b', unknown: '#bbb',
		};

		function scoreColor(score) {
		  if (score == null) return '#bbb';
		  // diverging: red (-1) -> grey (0) -> green (+1)
		  const t = (score + 1) / 2;
		  const r = Math.round(192 + (58 - 192) * t);
		  const g = Math.round(57 + (157 - 57) * t);
		  const b = Math.round(43 + (74 - 43) * t);
		  return `rgb(${r},${g},${b})`;
		}

		function sparklineSvg(series) {
		  const pts = series
		    .filter(s => typeof s.score === 'number' && s.score !== null)
		    .slice()
		    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
		  if (pts.length < 2) return '';
		  const W = 260, H = 84, pad = 8;
		  const xs = i => pad + (W - 2 * pad) * (i / (pts.length - 1));
		  const ys = v => H - pad - (H - 2 * pad) * ((v + 1) / 2);
		  const line = pts.map((s, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(s.score).toFixed(1)}`).join(' ');
		  const dots = pts.map((s, i) =>
		    `<circle cx="${xs(i).toFixed(1)}" cy="${ys(s.score).toFixed(1)}" r="3" fill="${scoreColor(s.score)}"><title>${escapeHtml(s.date)}: ${s.score.toFixed(2)} (${escapeHtml(s.label || '')})</title></circle>`
		  ).join('');
		  const zero = ys(0).toFixed(1);
		  return `<svg class="pd-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Sentiment over time">
		    <line x1="${pad}" y1="${zero}" x2="${W - pad}" y2="${zero}" stroke="#e0e0e0" stroke-width="1"/>
		    <path d="${line}" fill="none" stroke="#e85d04" stroke-width="2"/>${dots}</svg>`;
		}

		function renderPlaceDetail(data) {
		  const plural = data.episode_count === 1 ? 'episode' : 'episodes';
		  let html = `<div class="place-detail"><h3>${escapeHtml(data.name)}</h3>` +
		    `<div class="pd-count">Mentioned in ${data.episode_count} ${plural}</div>`;

		  const chart = sparklineSvg(data.series);
		  if (chart) html += chart;

		  if (data.narrative) {
		    html += `<div class="pd-narrative">` +
		      `<div><span class="pd-lab">Early on:</span> ${escapeHtml(data.narrative.early)}</div>` +
		      `<div><span class="pd-lab">Lately:</span> ${escapeHtml(data.narrative.recent)}</div>` +
		      `<div class="pd-arc">${escapeHtml(data.narrative.arc)}</div></div>`;
		  } else {
		    html += `<div class="pd-note">Not enough history for a trend yet.</div>`;
		  }

		  const items = data.series.slice().sort((a, b) => b.date.localeCompare(a.date)).map(s => {
		    const t = escapeHtml(s.title || s.date);
		    const chip = s.label && s.label !== 'unknown'
		      ? `<span class="pd-chip" style="background:${SENTIMENT_COLORS[s.label] || '#999'}">${escapeHtml(s.label)}</span>` : '';
		    const href = s.snippet_start_ms != null
		      ? `/?episode=${encodeURIComponent(s.episode_id)}&t=${Math.floor(s.snippet_start_ms / 1000)}`
		      : `/?episode=${encodeURIComponent(s.episode_id)}`;
		    const quote = s.snippet ? `<div style="color:#666;margin-top:2px">&ldquo;${escapeHtml(s.snippet)}&rdquo;</div>` : '';
		    return `<li><a href="${href}" target="_blank">${t}</a> <span class="ep-date">${escapeHtml(s.date)}</span>${chip}${quote}</li>`;
		  }).join('');
		  html += `<ul>${items}</ul></div>`;
		  return html;
		}

		const pdSheet = document.getElementById('pd-sheet');
		const pdBackdrop = document.getElementById('pd-backdrop');
		const pdSheetBody = document.getElementById('pd-sheet-body');
		const isMobile = () => window.matchMedia('(max-width: 640px)').matches;

		function closeSheet() {
		  pdSheet.classList.remove('open');
		  pdBackdrop.classList.remove('open');
		}
		document.querySelector('#pd-sheet .pd-close').addEventListener('click', closeSheet);
		pdBackdrop.addEventListener('click', closeSheet);
		document.addEventListener('keydown', (e) => {
		  if (e.key === 'Escape' && pdSheet.classList.contains('open')) closeSheet();
		});

		async function openPlaceDetail(place, circle) {
		  const mobile = isMobile();
		  const loadingHtml = `<div class="place-detail"><h3>${escapeHtml(place.name)}</h3>` +
		    `<div class="pd-loading">Loading insights…</div></div>`;

		  if (mobile) {
		    pdSheetBody.innerHTML = loadingHtml;
		    pdSheet.classList.add('open');
		    pdBackdrop.classList.add('open');
		  } else {
		    circle.bindPopup(loadingHtml, { maxWidth: 320, minWidth: 280 }).openPopup();
		  }

		  let html;
		  try {
		    const res = await fetch(`/api/place-detail?name=${encodeURIComponent(place.name)}`);
		    if (!res.ok) throw new Error(`HTTP ${res.status}`);
		    html = renderPlaceDetail(await res.json());
		  } catch {
		    html = `<div class="place-detail"><h3>${escapeHtml(place.name)}</h3>` +
		      `<div class="pd-note">Couldn't load insights.</div></div>`;
		  }

		  if (mobile) {
		    pdSheetBody.innerHTML = html;
		  } else {
		    circle.setPopupContent(html);
		  }
		}

		const map = L.map('map', { zoomControl: false }).setView([37.7749, -122.4194], 13);
		L.control.zoom({ position: 'topright' }).addTo(map);

		L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
			maxZoom: 20,
		}).addTo(map);

		let fuseIndex = null;
		const markersByName = new Map();

		function episodeDate(episodeId) {
			const m = episodeId.match(/(\d{4}-\d{2}-\d{2})/);
			return m ? m[1] : '';
		}

		function circleRadius(count, maxCount) {
			// Scale between 6px and 28px
			const minR = 6, maxR = 28;
			return minR + (maxR - minR) * Math.sqrt(count / maxCount);
		}

		async function loadPlaces() {
			const res = await fetch('/api/map-places');
			const data = await res.json();
			const places = data.places;

			document.getElementById('loading').remove();
			document.getElementById('place-count').textContent =
				`${places.length} places · ${data.total_mentions} episode mentions`;

			if (places.length === 0) return;

			const maxCount = Math.max(...places.map(p => p.episode_count));

			for (const place of places) {
				const radius = circleRadius(place.episode_count, maxCount);
				const circle = L.circleMarker([place.lat, place.lng], {
					radius,
					fillColor: '#e85d04',
					fillOpacity: 0.45,
					color: '#c44d02',
					weight: 1.5,
				}).addTo(map);

				markersByName.set(place.name, circle);

				const episodeItems = place.episodes
					.sort((a, b) => b.id.localeCompare(a.id))
					.map(ep => {
						const date = episodeDate(ep.id);
						const title = escapeHtml(ep.title || date);
						return `<li><a href="/?episode=${encodeURIComponent(ep.id)}" target="_blank">${title}</a><span class="ep-date">${escapeHtml(date)}</span></li>`;
					}).join('');

				const plural = place.episode_count === 1 ? 'episode' : 'episodes';
				circle.bindPopup(`
					<div class="place-popup">
						<h3>${escapeHtml(place.name)}</h3>
						<div class="count">Mentioned in ${place.episode_count} ${plural}</div>
						<ul>${episodeItems}</ul>
					</div>
				`, { maxWidth: 280 });

				// Desktop: show popup on hover; mobile keeps default click behavior
				let detailOpen = false;
				const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
				if (hasHover) {
					let closeTimer = null;
					circle.on('mouseover', () => {
						clearTimeout(closeTimer);
						circle.openPopup();
					});
					circle.on('mouseout', () => {
						closeTimer = setTimeout(() => { if (!detailOpen) circle.closePopup(); }, 300);
					});
					circle.on('popupopen', () => {
						const el = circle.getPopup().getElement();
						if (el) {
							el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
							el.addEventListener('mouseleave', () => {
								closeTimer = setTimeout(() => { if (!detailOpen) circle.closePopup(); }, 300);
							});
						}
					});
				}
				circle.on('click', () => { detailOpen = true; openPlaceDetail(place, circle); });
			}
			fuseIndex = new Fuse(places, {
				keys: ['name'],
				threshold: 0.4,
				ignoreLocation: true,
				minMatchCharLength: 2,
			});

			const searchControl = new SearchControl();
			searchControl.addTo(map);
			const container = searchControl.getContainer();
			const input = container.querySelector('input');
			const list = container.querySelector('.map-search-results');

			const runSearch = debounce(() => {
				const q = input.value.trim();
				if (!q) {
					list.classList.add('hidden');
					list.innerHTML = '';
					return;
				}
				const hits = fuseIndex.search(q, { limit: 8 });
				renderSearchResults(list, hits);
			}, 80);

			input.addEventListener('input', runSearch);
			input.addEventListener('focus', () => {
				if (input.value.trim()) list.classList.remove('hidden');
			});
			document.addEventListener('click', (e) => {
				if (!container.contains(e.target)) list.classList.add('hidden');
			});
			list.addEventListener('click', (e) => {
				const row = e.target.closest('li[data-name]');
				if (!row) return;
				selectResult(row.dataset.name, input, list);
			});

			input.addEventListener('keydown', (e) => {
				if (e.key === 'ArrowDown') {
					e.preventDefault();
					if (list.classList.contains('hidden') && input.value.trim()) {
						list.classList.remove('hidden');
					}
					moveActive(list, 1);
				} else if (e.key === 'ArrowUp') {
					e.preventDefault();
					moveActive(list, -1);
				} else if (e.key === 'Enter') {
					e.preventDefault();
					const active = list.querySelector('li.active[data-name]');
					if (active) selectResult(active.dataset.name, input, list);
				} else if (e.key === 'Escape') {
					input.value = '';
					list.classList.add('hidden');
					list.innerHTML = '';
					input.blur();
				}
			});

			document.addEventListener('keydown', (e) => {
				if (e.key !== '/') return;
				const target = e.target;
				const isTyping = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
				if (isTyping) return;
				e.preventDefault();
				input.focus();
			});
		}

		loadPlaces().catch(err => {
			document.getElementById('loading').textContent = 'Failed to load places.';
			console.error(err);
		});
	</script>
</body>
</html>
